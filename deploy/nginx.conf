# FinTrack — Nginx production configuration
# File: /etc/nginx/sites-available/fintrack
# Enable: ln -s /etc/nginx/sites-available/fintrack /etc/nginx/sites-enabled/
# Test:   nginx -t
# Reload: systemctl reload nginx

# Redirect HTTP → HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name yourdomain.com www.yourdomain.com;

    # Let's Encrypt challenge
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# Main HTTPS server
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name yourdomain.com www.yourdomain.com;

    # ─── SSL (Let's Encrypt via Certbot) ──────────────────────────────────
    ssl_certificate     /etc/letsencrypt/live/yourdomain.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/yourdomain.com/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    # ─── Security headers ─────────────────────────────────────────────────
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Frame-Options            DENY                                            always;
    add_header X-Content-Type-Options     nosniff                                         always;
    add_header Referrer-Policy            "strict-origin-when-cross-origin"               always;
    add_header Permissions-Policy         "geolocation=(), microphone=(), camera=()"      always;

    # ─── Logging ──────────────────────────────────────────────────────────
    access_log /var/log/nginx/fintrack_access.log;
    error_log  /var/log/nginx/fintrack_error.log  warn;

    # ─── Gzip compression ─────────────────────────────────────────────────
    gzip              on;
    gzip_vary         on;
    gzip_proxied      any;
    gzip_comp_level   6;
    gzip_min_length   1024;
    gzip_types
        text/plain text/css text/javascript application/javascript
        application/json application/xml image/svg+xml;

    # ─── Client limits ────────────────────────────────────────────────────
    client_max_body_size 10M;  # Allow avatar/file uploads up to 10 MB

    # ─── Static files (served directly by Nginx — no Django involved) ─────
    location /static/ {
        alias /path/to/fintrack_mobile/staticfiles/;
        expires     1y;
        add_header  Cache-Control "public, immutable";
        access_log  off;
        # Serve pre-compressed .gz files if available (WhiteNoise creates them)
        gzip_static on;
    }

    # ─── Media files (user uploads) ───────────────────────────────────────
    location /media/ {
        alias /path/to/fintrack_mobile/media/;
        expires    7d;
        add_header Cache-Control "public";
        access_log off;
    }

    # ─── Favicon & robots ─────────────────────────────────────────────────
    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    # ─── Django application (via Gunicorn Unix socket) ─────────────────────
    location / {
        proxy_pass         http://unix:/run/fintrack/gunicorn.sock;
        # Alternatively use TCP: proxy_pass http://127.0.0.1:8000;

        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        proxy_redirect     off;
        proxy_buffering    on;
        proxy_buffer_size  8k;
        proxy_buffers      8 8k;

        proxy_read_timeout    30s;
        proxy_connect_timeout  5s;
        proxy_send_timeout    30s;
    }
}
